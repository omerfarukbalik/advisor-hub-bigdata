<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat with Llama 3.2</title>
    <style>
        body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 12px; }
        #log { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto;
               padding: 12px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
               max-width: 85%; width: fit-content; }
        .user { background: #d9ecff; margin-left: auto; }
        .assistant { background: #eee; }
        #chatForm { display: flex; gap: 8px; margin-top: 10px; }
        #q { flex: 1; padding: 8px; }
    </style>
</head>
<body>
<h2>Chat with local Llama 3.2</h2>
<p><a th:href="@{/}">Back to supervisions</a></p>
<div id="log"></div>
<form id="chatForm">
    <input id="q" placeholder="Ask something..." autocomplete="off">
    <button type="submit">Send</button>
</form>

<script>
    const messages = [];                       // whole conversation, sent every time
    const log = document.getElementById('log');

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();                      // don't reload the page
      const input = document.getElementById('q');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      messages.push({ role: 'user', content: text });
      addBubble('user', text);
      const pending = addBubble('assistant', 'thinking...');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(messages)
        });
        const data = await res.json();
        pending.textContent = data.reply;
        messages.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        pending.textContent = 'Error: ' + err;
      }
    });
</script>
</body>
</html>
