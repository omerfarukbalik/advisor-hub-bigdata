spring.application.name=project2
server.port=8090

# ---- PostgreSQL (in Ubuntu) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/project2
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ---- Redis cache (in Ubuntu) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

# ---- HDFS (in Ubuntu) ----
hdfs.uri=hdfs://localhost:9000
hdfs.user=merba
hdfs.image-dir=/project2/images

# ---- Ollama (in Windows) ----
ollama.url=http://localhost:11434
ollama.model=llama3.2

# ---- Upload size ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Show cache hits/misses in the console (demo evidence) ----
logging.level.org.springframework.cache=TRACE